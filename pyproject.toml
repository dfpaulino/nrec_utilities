[project]
name = "nrec-utils"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "dpaulino", email = "dfpaulino@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5",
    "opencv-python>=5.0",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    # vnoise imports pkg_resources, which setuptools 82 removed
    "setuptools>=81,<82",
    "tqdm>=4.70.1",
    "vnoise>=0.1.0"
]

[project.scripts]
nrec-yolo = "nrec_utils.migrate_nrec_to_yolo:cli"
nrec-occlude = "nrec_utils.create_occluded_set:cli"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
    
[tool.pytest.ini_options]
testpaths = ["tests"]
